version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: creatorpilot-postgres
    environment:
      POSTGRES_DB: creatorpilot
      POSTGRES_USER: creatorpilot_admin
      POSTGRES_PASSWORD: creatorpilot_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: creatorpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  creatorpilot-mcp:
    build:
      context: ../creatorpilot-mcp
      dockerfile: ../creatorpilot-infra/mcp.Dockerfile
    container_name: creatorpilot-mcp
    ports:
      - "8001:8001"
    environment:
      POSTGRES_URL: postgresql://creatorpilot_admin:creatorpilot_secret@postgres:5432/creatorpilot
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  creatorpilot-api:
    build:
      context: ../creatorpilot-api
      dockerfile: ../creatorpilot-infra/api.Dockerfile
    container_name: creatorpilot-api
    ports:
      - "8000:8000"
    environment:
      MCP_BASE_URL: http://creatorpilot-mcp:8001
      DATABASE_URL: postgresql+asyncpg://creatorpilot_admin:creatorpilot_secret@postgres:5432/creatorpilot
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    depends_on:
      - creatorpilot-mcp
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
