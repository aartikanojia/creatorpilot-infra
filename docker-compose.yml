services:
  postgres:
    image: postgres:15-alpine
    container_name: creatorpilot-postgres
    environment:
      POSTGRES_DB: creatorpilot
      POSTGRES_USER: creatorpilot_admin
      POSTGRES_PASSWORD: creatorpilot_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: creatorpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  creatorpilot-mcp:
    build:
      context: ../creatorpilot-mcp
      dockerfile: ../creatorpilot-infra/mcp.Dockerfile
      platforms:
        - linux/arm64
    container_name: creatorpilot-mcp
    ports:
      - "8001:8001"
    environment:
      # Database
      POSTGRES_URL: postgresql://creatorpilot_admin:creatorpilot_secret@postgres:5432/creatorpilot
      DATABASE_URL: postgresql://creatorpilot_admin:creatorpilot_secret@postgres:5432/creatorpilot
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: creatorpilot_admin
      POSTGRES_PASSWORD: creatorpilot_secret
      POSTGRES_DB: creatorpilot
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Azure OpenAI (primary LLM)
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      # Gemini (fallback LLM)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Feature flags
      FORCE_PRO_MODE: ${FORCE_PRO_MODE:-false}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  creatorpilot-api:
    build:
      context: ../creatorpilot-api
      dockerfile: ../creatorpilot-infra/api.Dockerfile
      platforms:
        - linux/arm64
    container_name: creatorpilot-api
    ports:
      - "8000:8000"
    volumes:
      - ../creatorpilot-api/config/firebase.json:/secrets/firebase.json
    environment:
      MCP_BASE_URL: http://creatorpilot-mcp:8001
      DATABASE_URL: postgresql+asyncpg://creatorpilot_admin:creatorpilot_secret@postgres:5432/creatorpilot
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FIREBASE_CREDENTIALS: /secrets/firebase.json
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - creatorpilot-mcp
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
